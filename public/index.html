<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Oración Católica</title>
<meta name="description" content="Una oración y una reflexión para cada amanecer y cada noche, todo el año.">
<meta name="theme-color" content="#3b1c7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oración">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-periodo="manana">
<div id="fondo" aria-hidden="true"></div>

<main id="app" hidden>
  <header class="top">
    <button id="btnMenu" class="menu-btn" type="button" aria-label="Abrir el menú: oraciones, mandamientos, sacramentos, salmos, novena, velada, novenario y diario" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Menú">
      <svg class="mb-abrir" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      <svg class="mb-cerrar" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="mb-tx">Menú</span>
    </button>
    <div class="fecha" role="group" aria-label="Fecha y hora">
      <div class="fecha-fila">
        <time id="horaTxt" class="hora"></time>
        <span id="momentoTxt" class="solo-lectores"></span>
      </div>
      <span id="fechaTxt" class="dia-txt"></span>
    </div>
    <button id="btnSalir" class="icono-btn salir" type="button" aria-label="Salir" title="Salir">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
    </button>
    <nav id="menu" class="menu" aria-label="Más oraciones y enseñanzas" hidden>
      <p class="menu-cab">Para orar y aprender</p>
      <div id="menuLista" role="menu"></div>
    </nav>
  </header>

  <div id="aviso" class="aviso" hidden></div>

  <section class="tarjeta oracion" id="tOracion" aria-labelledby="tituloOracion">
    <div class="arte" id="arte"></div>
    <div class="scrim"></div>
    <div class="contenido">
      <div class="chips">
        <span class="chip" id="chipFigura"></span>
        <span class="chip chip-esp" id="chipEsp" hidden></span>
      </div>
      <h1 id="tituloOracion"></h1>
      <div class="texto" id="textoOracion"></div>
    </div>
  </section>

  <section class="tarjeta reflexion" id="tReflexion" aria-labelledby="tituloReflexion">
    <div class="contenido">
      <div class="refl-cab">
        <h2 id="tituloReflexion"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/><path d="M10 21h4"/></svg>Reflexión</h2>
        <span class="cita" id="citaTxt" hidden></span>
      </div>
      <div class="texto">
        <p id="textoReflexion"></p>
      </div>
      <div class="proposito">
        <span class="prop-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <div><b>Propósito del día</b><span id="propositoTxt"></span></div>
      </div>
    </div>
  </section>
</main>

<!-- Bienvenida (distinta cada día) -->
<div id="bienvenida" class="overlay bienvenida" role="dialog" aria-modal="true" aria-labelledby="bienTitulo">
  <div class="arte" id="arteBien"></div>
  <div class="scrim fuerte"></div>
  <div class="bien-cuerpo">
    <p class="bien-saludo" id="bienSaludo"></p>
    <h1 id="bienTitulo"></h1>
    <p class="bien-frase" id="bienFrase"></p>
    <button id="btnEntrar" class="entrar" type="button">Entrar<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="instalar" id="instalar" hidden>
      <span id="instalarTxt"></span>
      <button id="btnInstalar" type="button" hidden>Instalar app</button>
    </div>
    <small class="bien-version" id="bienVersion"></small>
  </div>
</div>

<!-- Pantalla de sección (Mandamientos, Sacramentos, Salmos, Novena) -->
<div id="seccion" class="seccion" role="dialog" aria-modal="true" aria-labelledby="seccionTitulo" hidden>
  <div class="seccion-in">
    <header class="seccion-top">
      <button id="btnAtras" class="icono-btn" type="button" aria-label="Volver" title="Volver">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span id="seccionIco" class="menu-ico" aria-hidden="true"></span>
      <div class="seccion-tt"><h1 id="seccionTitulo"></h1><small id="seccionSub"></small></div>
    </header>
    <div id="seccionCuerpo" class="seccion-cuerpo"></div>
  </div>
</div>

<!-- Aviso de actualización -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <div class="toast-txt"><b id="toastTit"></b><span id="toastMsg"></span></div>
  <button id="toastBtn" type="button"></button>
</div>

<!-- Despedida al salir -->
<div id="despedida" class="overlay despedida" hidden>
  <div class="despedida-cuerpo">
    <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M6 9h12"/></svg>
    <p id="despedidaTxt"></p>
    <small>Toca la pantalla para volver</small>
  </div>
</div>

<noscript><p style="padding:2rem;color:#fff">Esta aplicación necesita JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
